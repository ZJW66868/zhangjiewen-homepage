      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#fbe4ff"/>
    </linearGradient>
    <linearGradient id="avatar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f7cff"/>
      <stop offset="100%" stop-color="#9b6bff"/>
